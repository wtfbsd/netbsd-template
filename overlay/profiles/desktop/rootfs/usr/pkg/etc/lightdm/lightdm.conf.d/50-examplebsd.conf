# 50-examplebsd.conf — LightDM configuration for the desktop profile.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# X11 only: the greeter is lightdm-gtk-greeter and the session is Xfce.
# There is no Wayland anywhere in this distribution.
#
# pkgsrc installs its LightDM configuration under the pkgsrc prefix
# (/usr/pkg/etc/lightdm).

[LightDM]
Directory=/usr/pkg/share/lightdm/greeters:/usr/local/share/lightdm/greeters
Greeter=lightdm-gtk-greeter
user-session=xfce
sessions-directory=/usr/pkg/share/lightdm/sessions:/usr/local/share/lightdm/sessions
# The desktop has no password login on the serial console; the operator
# provisions a login on the greeter.
greeter-hide-users=false
