# product.conf — the NetBSD example (ExampleBSD, NetBSD flavour).
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# This is the exact output format of wtfbsd/agents scripts/apply-answers.sh
# (flat KEY=value, one outer pair of single quotes around each value, then
# the per-OS honesty trailer). It is kept here as a fixture so that this
# template can be tested without the answers repo being present.
#
# The values come from the NetBSD example answers
# (DISTRO_OS=netbsd, FILESYSTEM_ROOT=ffs, ZFS_DATA_POOL=yes,
# ZFS_POOL_NAME=exampledata, PROFILE=appliance). The brand URL and the
# publish target are the example.org placeholder this template requires;
# they are plain data to the build and are not used for anything else.
#
DISTRO_OS='netbsd'
DISTRO_NAME='ExampleBSD'
DISTRO_SLUG='examplebsd'
DISTRO_ARCH='amd64'
FILESYSTEM_ROOT='ffs'
ZFS_DATA_POOL='yes'
ZFS_POOL_NAME='exampledata'
PROFILE='appliance'
PACKAGE_SET='base-server'
INSTALLER='tui'
MOTD='ExampleBSD — a small NetBSD distribution with a ZFS data pool'
BRAND_COLOR='2e7d66'
BRAND_URL='https://example.org'
CI_ENABLED='yes'
PUBLISH_METHOD='api'
PUBLISH_TARGET='example.org'
PUBLISHER_ORG='wtfbsd'
#
# honest per-OS row used for this build (from questions.yaml):
#   DISTRO_OS  netbsd
#   arch       amd64 aarch64
#   root_fs    ffs
#   installer  tui
#   zfs_pool   data-only
